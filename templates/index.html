<body>
  <section class="fullscreen">
    <div class="center-object">
      <section class="me">
        <h1 class="title"><img src="https://global.media.stuxapis.net/secretgen/logo.svg" alt="SecretGen" class="logo-img"></h1>
        <span class="undertitle">
          <span class="tagline">A simple API which will generate secrets.</span>
          <br>
          <span class="subtext"><i>Built &amp; Maintained by <a class="accent-text" href="https://stuxapis.net">StuxAPIs</a>, Hosted by <a class="accent-text" href="https://stuxedo.com">Stuxedo</a></i></span>
        </span>
      </section>
      <div class="generator">
        <div class="generator-row">
          <label for="len">Length</label>
          <input type="number" id="len" min="1" max="1024" value="32">
          <button id="gen-btn" class="btn accent-bg" type="button">Generate</button>
        </div>
        <div class="generator-result" id="result-row" hidden>
          <code id="result-text"></code>
          <button id="copy-btn" class="btn-copy" type="button"><i class="fa-solid fa-clipboard" aria-hidden="true"></i> <span id="copy-btn-label">Copy</span></button>
        </div>
        <p class="generator-error" id="gen-error" hidden></p>
        <noscript>
          <div class="usage">
            <code>GET /32</code>
            <code>GET /64</code>
            <code>GET /128</code>
          </div>
          <div class="buttons">
            <a href="/32" class="btn accent-bg">Generate a secret</a>
          </div>
        </noscript>
      </div>
    </div>
    <footer class="site-footer">

      &middot; <a href="/about" style="color:inherit;">About</a>
      &middot; <a href="https://services.stuxapis.net" style="color:inherit;">A StuxAPIs Service</a>
    </footer>
  </section>
  <script src="/assets/app.js?v=__VERSION__"></script>
</body>
</html>
