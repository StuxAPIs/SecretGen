name: CI

# Runs the checks on pushes to main, staging and test, and on every pull request (the pull requests
# from test into staging and from staging into main need this to pass before they are merged).
on:
  push:
    branches: [main, staging, test]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: bash tests/version.sh
